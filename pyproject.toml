[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transcreve-ai"
version = "1.0.0"
description = "TranscreveAI extrai dossies multimodais de videos para base de conhecimento."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["ai", "video", "transcription", "ocr", "knowledge-base", "yt-dlp"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Video",
  "Topic :: Text Processing :: Indexing",
]
dependencies = [
  "yt-dlp>=2026.7.4",
  "openai>=1.0.0",
]

[project.optional-dependencies]
local = [
  "faster-whisper>=1.0.0",
  "sentence-transformers>=3.0.0",
]
gemini = [
  "google-generativeai>=0.7.0",
]
anthropic = [
  "anthropic>=0.30.0",
]
obsidian = [
  "python-frontmatter>=1.0.0",
]
notion = [
  "notion-client>=2.2.0",
]
supabase = [
  "supabase>=2.0.0",
]
s3 = [
  "boto3>=1.34.0",
]
web = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.29.0",
  "python-multipart>=0.0.9",
  "sse-starlette>=2.1.0",
]
mcp = [
  "mcp>=1.0.0",
]
rag = [
  "numpy>=1.24.0",
]
dev = [
  "ruff>=0.4.0",
  "mypy>=1.10.0",
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
]

[project.entry-points."transcreve_ai.storage"]
filesystem = "video_kb.storage.filesystem:FilesystemBackend"

[project.urls]
Homepage = "https://github.com/nikolasdehor/transcreve-ai"
Repository = "https://github.com/nikolasdehor/transcreve-ai"
Issues = "https://github.com/nikolasdehor/transcreve-ai/issues"

[project.scripts]
transcreveai = "video_kb.cli:main"
transcreve-ai = "video_kb.cli:main"
video-kb = "video_kb.cli:main"
transcreveai-mcp = "video_kb.mcp_server:main"

[tool.setuptools.packages.find]
include = ["video_kb*"]

[tool.setuptools.package-data]
"video_kb.eval" = ["datasets/*.json", "datasets/*.txt"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--maxfail=1", "--disable-warnings", "-ra"]

[tool.mypy]
ignore_missing_imports = true
# sem strict para nao bloquear codigo legado existente
